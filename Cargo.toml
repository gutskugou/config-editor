[package]
name = "config-editor"
version = "0.2.0"
edition = "2021"

[lib]
name = "config_editor"
path = "src/lib.rs"

[[bin]]
name = "config-editor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
jsonc-parser = "0.33"
regex = "1"
sha2 = "0.10"
libc = "0.2"
similar = "3"
shell-words = "1"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
ratatui = "0.30"
crossterm = "0.29"
tempfile = "3"
