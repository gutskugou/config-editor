name: Bug report
description: Report a reproducible problem in Config Editor
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and private configuration content before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: config-editor v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04 / WSL 2 / terminal name
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
